[project]
name = "mmf-schema"
version = "0.1.0"
description = "모든 모듈이 공유하는 메타데이터 스키마와 Extractor 인터페이스"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmf_schema"]
