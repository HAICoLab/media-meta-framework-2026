[project]
name = "mmf-web-crawler"
version = "0.1.0"
description = "[1] URL을 받아 페이지를 수집하고 메타데이터를 추출"
requires-python = ">=3.10"
dependencies = ["mmf-schema", "httpx>=0.27", "beautifulsoup4>=4.12"]

[tool.uv.sources]
mmf-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmf_web_crawler"]
