[project]
name = "mmf-public-data"
version = "0.1.0"
description = "[3] 공개 데이터셋 목록(registry.yaml)을 관리하고 메타데이터로 정리"
requires-python = ">=3.10"
dependencies = ["mmf-schema", "pyyaml>=6"]

[tool.uv.sources]
mmf-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmf_public_data"]
