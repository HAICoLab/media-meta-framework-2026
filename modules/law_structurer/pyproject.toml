[project]
name = "mmf-law-structurer"
version = "0.1.0"
description = "[2] 법령 TXT를 조·항·호·목 계층으로 구조화하고 메타데이터 정리"
requires-python = ">=3.10"
dependencies = ["mmf-schema"]

[tool.uv.sources]
mmf-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmf_law_structurer"]
