name: 작업
description: 새 기능·개선 작업
title: "[모듈] "
labels: ["type:task"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 모듈
      options:
        - "1. web_crawler"
        - "2. law_structurer"
        - "3. public_data"
        - "4. framework"
        - "schema (공통)"
        - "기타 / 인프라"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을, 왜 하는지
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: |
        - [ ] 샘플 입력 3건에서 스키마에 맞는 출력
        - [ ] 테스트 추가
  - type: checkboxes
    id: schema
    attributes:
      label: 스키마 영향
      options:
        - label: 이 작업은 schema/ 변경이 필요합니다 (별도 schema 이슈로 먼저 논의)
