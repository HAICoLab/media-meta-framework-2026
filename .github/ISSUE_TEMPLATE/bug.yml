name: 버그
description: 잘못된 추출 결과나 오류
title: "[bug] "
labels: ["type:bug"]
body:
  - type: input
    id: source
    attributes:
      label: 입력 (URL / 파일명)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과와 실제 결과
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 오류 메시지
      render: shell
