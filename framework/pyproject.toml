[project]
name = "mmf-framework"
version = "0.1.0"
description = "[4] 입력 유형에 맞는 모듈을 골라 실행하고 결과를 하나의 스키마로 통합"
requires-python = ">=3.10"
dependencies = ["mmf-schema", "mmf-web-crawler", "mmf-law-structurer", "mmf-public-data"]

[project.scripts]
mmf = "mmf_framework.cli:main"

[tool.uv.sources]
mmf-schema = { workspace = true }
mmf-web-crawler = { workspace = true }
mmf-law-structurer = { workspace = true }
mmf-public-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmf_framework"]
